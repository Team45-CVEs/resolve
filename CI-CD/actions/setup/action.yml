name: Input Synthesis - Setup
description: >
  First stage of the RESOLVE input-synthesis pipeline. Drives a coding agent to
  prepare the checked-out repo for CVE analysis: check out the affected
  version, map architecture/deps/build steps into the agent file
  (CLAUDE.md / AGENTS.md), install dependencies with source available, and
  build into build/. Runs inside the RESOLVE runtime image (setup/Dockerfile).
  Operates on a single CVE; loop in the caller to cover many.

inputs:
  cve-path:
    description: "Path to the CVE file, relative to the workspace."
    required: true
  agent:
    description: "Coding-agent backend: claude | codex | opencode."
    default: "claude"
  api-key:
    description: >
      API key for the agent. Required for claude (ANTHROPIC) and codex (OPENAI);
      ignored for opencode. If empty, the matching *_API_KEY must already be in
      the environment.
    default: ""
  model:
    description: "Optional --model override passed through to the agent CLI."
    default: ""
  target-dir:
    description: >
      Subdirectory of the checked-out repo to prepare, relative to the
      workspace. Default '.' = the repo root. This is where the affected
      version is checked out and built.
    default: "."
  image:
    description: >
      Prebuilt RESOLVE image to reuse. If empty, builds setup/Dockerfile with
      AI_BACKEND=<agent>. Pass a tag you built once earlier in the job to avoid
      rebuilding.
    default: ""

outputs:
  image:
    description: "The image tag used (handy to pass to later stages so they reuse it)."
    value: ${{ steps.image.outputs.image }}
  agents-file:
    description: "The agent memory file setup writes (CLAUDE.md or AGENTS.md)."
    value: ${{ steps.setup.outputs.agents-file }}

runs:
  using: composite
  steps:
    # --- resolve the image (build once if not provided) ---------------------
    - name: Resolve RESOLVE runtime image
      id: image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        AGENT: ${{ inputs.agent }}
      run: |
        set -euo pipefail
        if [ -z "$IMAGE" ]; then
          repo_root=$(realpath "$GITHUB_ACTION_PATH/../../..")
          IMAGE="resolve-input-synthesis:$AGENT"
          docker build --build-arg AI_BACKEND="$AGENT" -t "$IMAGE" \
            -f "$repo_root/setup/Dockerfile" "$repo_root/setup"
        fi
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

    # --- run the setup stage ------------------------------------------------
    # The action stays thin: it wires inputs in as INPUT_* env vars and mounts,
    # then runs CI-CD/scripts/setup.py, which does the agent->key mapping, runs
    # the stage, and sets outputs. Mirrors the sbom action.
    - name: Setup target
      id: setup
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.image }}
        # INPUT_<NAME> is the convention ci_env.get_input reads on GitHub.
        INPUT_CVE_PATH: ${{ inputs.cve-path }}
        INPUT_AGENT: ${{ inputs.agent }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_TARGET_DIR: ${{ inputs.target-dir }}
      run: |
        set -euo pipefail
        repo_root=$(realpath "$GITHUB_ACTION_PATH/../../..")

        # CVE path is made absolute so it resolves regardless of the target
        # working dir the agent operates in.
        abs_cve="/work/$INPUT_CVE_PATH"

        # GITHUB_OUTPUT / GITHUB_STEP_SUMMARY are mounted so setup.py can set the
        # step output and summary from inside the container; GITHUB_ACTIONS lets
        # ci_env detect the platform. PYTHONPATH runs resolve-cli from this repo
        # instead of the release pinned in the image. -w is the target the agent
        # checks out/builds into.
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/work" \
          -w "/work/$INPUT_TARGET_DIR" \
          -v "$repo_root:/resolve:ro" \
          -v "$GITHUB_OUTPUT:/gh/output" -e GITHUB_OUTPUT=/gh/output \
          -v "$GITHUB_STEP_SUMMARY:/gh/summary" -e GITHUB_STEP_SUMMARY=/gh/summary \
          -e GITHUB_ACTIONS \
          -e PYTHONPATH=/resolve/resolve-cli/src \
          -e INPUT_CVE_PATH="$abs_cve" \
          -e INPUT_AGENT -e INPUT_MODEL -e INPUT_API_KEY -e INPUT_TARGET_DIR \
          "$IMAGE" \
          /opt/resolve/bin/python3 /resolve/CI-CD/scripts/setup.py
